<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argos · Discovery de influencers · {{GENERATED_DATE_SHORT}}</title>
<style>
  :root {
    --bg: #0b0e17;
    --bg-grad: radial-gradient(ellipse 120% 60% at 50% 0%, #151d33 0%, #0b0e17 60%);
    --card: #141922;
    --card-hover: #171d28;
    --border: #252d40;
    --border-strong: #323d55;
    --text: #e8ecf6;
    --text-dim: #8a94ad;
    --text-faint: #5a6478;
    --accent: #8b5cf6;
    --accent-soft: rgba(139, 92, 246, 0.12);
    --accent-border: rgba(139, 92, 246, 0.35);
    --ok: #34d399;
    --ok-soft: rgba(52, 211, 153, 0.12);
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.14);
    --bad: #f87171;
    --bad-soft: rgba(248, 113, 113, 0.14);
    --info: #38bdf8;
    --info-soft: rgba(56, 189, 248, 0.14);
    --radius: 14px;
    --radius-sm: 9px;
    --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25);

    --pillar-lifestyle: #22d3ee;
    --pillar-musica: #a78bfa;
    --pillar-comedia: #fbbf24;
    --pillar-comida: #fb7185;
    --pillar-futbol: #4ade80;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: var(--font);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { background: var(--bg-grad); min-height: 100vh; }
  a { color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 60px 28px 100px; }

  /* ─── Header ─── */
  header.page { margin-bottom: 36px; }
  .wordmark-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .wordmark {
    font-size: 11px; font-weight: 800; letter-spacing: 3px;
    text-transform: uppercase; color: var(--accent);
  }
  .sep { color: var(--border-strong); font-size: 14px; line-height: 1; }
  header.page h1 {
    font-size: clamp(28px, 4.5vw, 42px); font-weight: 800;
    line-height: 1.1; letter-spacing: -0.025em;
    margin: 0 0 8px; color: var(--text); max-width: 820px;
  }
  header.page .meta {
    font-size: 13px; color: var(--text-dim);
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }

  /* ─── Sticky pillar nav ─── */
  .pillar-nav {
    position: sticky; top: 12px; z-index: 10;
    background: rgba(11, 14, 23, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px;
    display: flex; gap: 4px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin-bottom: 36px;
    scrollbar-width: none;
  }
  .pillar-nav::-webkit-scrollbar { display: none; }
  .pillar-nav button {
    appearance: none; background: transparent; border: 0; cursor: pointer;
    font-family: inherit;
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pillar-nav button:hover { background: var(--card); color: var(--text); }
  .pillar-nav button.active {
    background: var(--accent-soft);
    color: var(--text);
    box-shadow: inset 0 0 0 1px var(--accent-border);
  }
  .pillar-nav button .count {
    font-size: 10px; font-weight: 700;
    background: var(--border); color: var(--text-dim);
    padding: 1px 6px; border-radius: 999px;
    min-width: 18px; text-align: center;
  }
  .pillar-nav button.active .count {
    background: var(--accent); color: #0b0e17;
  }
  .pillar-nav button .swatch {
    width: 8px; height: 8px; border-radius: 50%;
  }

  /* ─── Pillar section ─── */
  .pillar {
    margin-bottom: 56px;
  }
  .pillar-header {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 14px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .pillar-badge {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; line-height: 1;
    background: var(--card); border: 1px solid var(--border);
  }
  .pillar-badge.p-lifestyle { color: var(--pillar-lifestyle); border-color: rgba(34,211,238,.3); background: rgba(34,211,238,.08); }
  .pillar-badge.p-musica    { color: var(--pillar-musica);    border-color: rgba(167,139,250,.3); background: rgba(167,139,250,.08); }
  .pillar-badge.p-comedia   { color: var(--pillar-comedia);   border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.08); }
  .pillar-badge.p-comida    { color: var(--pillar-comida);    border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.08); }
  .pillar-badge.p-futbol    { color: var(--pillar-futbol);    border-color: rgba(74,222,128,.3); background: rgba(74,222,128,.08); }

  .pillar-title {
    font-size: 22px; font-weight: 800;
    letter-spacing: -0.015em; margin: 0;
    line-height: 1.1;
  }
  .pillar-count {
    margin-left: auto; font-size: 11px; font-weight: 700;
    color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase;
  }

  .pillar-keywords {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 20px;
  }
  .kw {
    font-size: 11px; font-weight: 500;
    color: var(--text-dim);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 999px;
  }

  /* ─── Profile cards ─── */
  .profiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 14px;
  }
  .profile-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color .15s ease, transform .15s ease;
    display: flex; flex-direction: column; gap: 16px;
  }
  .profile-card:hover { border-color: var(--border-strong); }

  .profile-head {
    display: flex; gap: 12px; align-items: flex-start;
  }
  .avatar {
    width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .avatar.p-lifestyle { background: rgba(34,211,238,.12); color: var(--pillar-lifestyle); }
  .avatar.p-musica    { background: rgba(167,139,250,.12); color: var(--pillar-musica); }
  .avatar.p-comedia   { background: rgba(251,191,36,.12); color: var(--pillar-comedia); }
  .avatar.p-comida    { background: rgba(251,113,133,.12); color: var(--pillar-comida); }
  .avatar.p-futbol    { background: rgba(74,222,128,.12); color: var(--pillar-futbol); }

  .profile-identity { flex: 1; min-width: 0; }
  .profile-name {
    font-size: 15px; font-weight: 700; margin: 0 0 2px;
    line-height: 1.2; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
  }
  .verified {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--info); color: #0b0e17; font-size: 9px; font-weight: 900;
    flex-shrink: 0;
  }
  .profile-handle a {
    font-size: 12px; color: var(--text-dim);
    text-decoration: none; font-weight: 500;
  }
  .profile-handle a:hover { color: var(--accent); text-decoration: underline; }

  .profile-stats {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 11px; color: var(--text-dim);
    padding-top: 2px;
  }
  .profile-stats b {
    color: var(--text); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .profile-bio {
    font-size: 13px; color: var(--text);
    background: rgba(255,255,255,0.02);
    border-left: 2px solid var(--border-strong);
    padding: 8px 12px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .profile-bio.empty { color: var(--text-faint); font-style: italic; }

  .section-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 700;
    margin-bottom: 7px;
  }

  .matched-kw { display: flex; flex-wrap: wrap; gap: 5px; }
  .matched-kw .kw-tag {
    font-size: 11px; font-weight: 500;
    padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); border: 1px solid var(--accent-border);
    color: #c4b5fd;
  }

  .top-post {
    display: flex; gap: 10px; align-items: center;
    padding: 10px 12px;
    background: rgba(255,255,255,.02);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    text-decoration: none; color: var(--text);
    transition: background .15s ease, border-color .15s ease;
  }
  .top-post:hover { background: var(--card-hover); border-color: var(--border-strong); }
  .top-post .likes-badge {
    font-weight: 800; font-size: 14px; color: var(--accent);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .top-post .likes-label {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 700;
    margin-top: -2px;
  }
  .top-post .post-info { flex: 1; min-width: 0; }
  .top-post .post-info .post-date {
    font-size: 11px; color: var(--text-dim); margin-top: 2px;
  }
  .top-post .post-info .post-type {
    font-size: 11px; font-weight: 600; color: var(--text);
  }
  .top-post .arrow { color: var(--text-faint); font-size: 14px; }

  .consistency-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .consistency-cell {
    background: var(--card);
    padding: 10px 12px;
  }
  .consistency-cell .lbl {
    font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 700; margin-bottom: 2px;
  }
  .consistency-cell .val {
    font-size: 15px; font-weight: 800; color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .consistency-cell .val.ok { color: var(--ok); }

  /* ─── Safety check ─── */
  .safety {
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 2px;
  }
  .safety-head {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
    gap: 10px;
  }
  .safety-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    letter-spacing: 0.2px;
  }
  .safety-badge::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
  }
  .safety-badge.clean    { background: var(--ok-soft);  color: var(--ok); }
  .safety-badge.clean::before    { background: var(--ok); }
  .safety-badge.findings { background: var(--bad-soft); color: var(--bad); }
  .safety-badge.findings::before { background: var(--bad); }
  .safety-badge.unknown  { background: var(--warn-soft); color: var(--warn); }
  .safety-badge.unknown::before  { background: var(--warn); }
  .safety-caret {
    color: var(--text-faint); font-size: 11px;
    transition: transform .18s ease;
  }
  details[open] .safety-caret { transform: rotate(90deg); }
  .safety-body {
    margin-top: 12px;
    font-size: 13px; color: var(--text);
    line-height: 1.55;
  }
  .safety-body p { margin: 0 0 10px; }
  .safety-sources {
    list-style: none; padding: 0; margin: 10px 0 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .safety-sources li a {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--info);
    text-decoration: none;
    padding: 7px 10px;
    background: var(--info-soft);
    border: 1px solid rgba(56, 189, 248, .25);
    border-radius: var(--radius-sm);
  }
  .safety-sources li a:hover { background: rgba(56, 189, 248, .22); }
  .safety-sources .src-arrow { margin-left: auto; color: var(--text-dim); font-size: 11px; }

  /* ─── Empty pillar ─── */
  .pillar-empty {
    padding: 28px;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  @media (max-width: 640px) {
    .wrap { padding: 40px 18px 70px; }
    .profiles-grid { grid-template-columns: 1fr; }
    .consistency-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <div class="wordmark-row">
      <span class="wordmark">ARGOS · DISCOVERY</span>
    </div>
    <h1>{{REPORT_TITLE}}</h1>
    <div class="meta">
      <span>Generado el <b>{{GENERATED_DATE_LONG}}</b></span>
    </div>
  </header>

  <nav class="pillar-nav" aria-label="Verticales">
    {{PILLAR_NAV_HTML}}
  </nav>

  {{PILLARS_HTML}}
</div>

<script>
  const navBtns = document.querySelectorAll('[data-pillar-filter]');
  const pillars = document.querySelectorAll('.pillar');
  navBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const filter = btn.dataset.pillarFilter;
      navBtns.forEach(b => b.classList.toggle('active', b === btn));
      pillars.forEach(p => {
        p.style.display = (filter === 'all' || p.dataset.pillarKey === filter) ? '' : 'none';
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
</script>
</body>
</html>
